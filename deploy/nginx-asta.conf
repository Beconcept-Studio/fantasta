# ─── nginx davanti all'app (F8-02) ───────────────────────────────────────────
#
# Non è un file che nginx include così com'è: su Ploi il `server { }` (e le due
# righe del certificato Let's Encrypt) li genera Ploi. Questo è **il contenuto
# da incollare dentro quel server block**, sostituendo il `location /` che Ploi
# mette di default.
#
#   Ploi → il sito → Manage → Nginx configuration
#   (poi `sudo nginx -t && sudo systemctl reload nginx`, oppure il pulsante di Ploi)
#
# Il blocco che conta è il primo. Senza `proxy_buffering off` sulla rotta dello
# stream, nginx accumula la risposta e la consegna a blocchi: gli snapshot
# arrivano in gruppo e i countdown dei partecipanti si muovono a scatti di
# trenta secondi invece che ogni secondo. È il sintomo peggiore possibile,
# perché l'app *sembra* funzionare.
#
# L'applicazione manda già `X-Accel-Buffering: no` sulla risposta dello stream
# (app/api/auctions/[id]/stream/route.ts) e nginx quell'header lo rispetta:
# le due difese sono deliberatamente ridondanti. Quella nell'header protegge
# anche il giorno in cui questo file verrà rigenerato da Ploi e nessuno se ne
# accorgerà; questa protegge dal giorno in cui un refactoring toglierà l'header.

# ⚠ ─── `/favicon.ico` in produzione non arriva a Node, e si è deciso di lasciarlo
#
# Questo file sostituisce il `location /` di Ploi, **non tutto** il server block:
# quello che Ploi genera contiene anche il suo boilerplate, e dentro c'è
#
#     location = /favicon.ico { access_log off; log_not_found off; }
#
# che nginx risolve **dal disco**. In un progetto Next con `output: 'standalone'`
# quel file sul disco non c'è — sta dentro `app/`, e lo serve l'applicazione —
# quindi nginx risponde 404 di suo e la richiesta non raggiunge mai Node.
#
# Individuato il 2026-08-18 dopo il rilascio di v1.15.1, e la prova sta nelle
# intestazioni: il 404 di `/favicon.ico` è quello di nginx (146 byte, «nginx» nel
# corpo, **nessun `x-powered-by: Next.js`**), mentre qualunque altro percorso
# inesistente riceve il 404 di Next. Ed è un match esatto, non per estensione:
# `/qualsiasi-cosa.ico` arriva a Node senza problemi.
#
# ⚠ **È preesistente, non l'ha introdotto v1.15.1**: anche prima, con il
# `favicon.ico` che Next.js mette in un progetto nuovo, quel percorso in
# produzione non ha mai servito niente. Il rilascio dell'icona l'ha solo reso
# visibile.
#
# **Perché si lascia così** (decisione dell'owner, 2026-08-18): l'icona si vede
# comunque. `app/icon.png` risponde 200 ed è dichiarato nel `<link>`, quindi il
# browser prende quello e lo ridimensiona da sé; iOS prende `apple-icon.png`.
# L'unica cosa che si perde è la resa a 16/32/48 preparata a mano dentro l'ICO.
# Il `<link rel="icon" href="/favicon.ico">` che Next emette resta un link morto,
# ed è innocuo: il browser scende al successivo. Non vale una modifica alla
# configurazione di un server in produzione per la nitidezza di un'icona a 16px.
#
# ⚠ **Riesaminato il 2026-08-28, con l'icona nuova, e confermato.** Quel giorno la
# linguetta ha avuto una sorgente sua (`fixtures/logo-favicon.png`), e l'ICO ha
# smesso di essere un di più: contiene **tre riduzioni curate a mano** a 16, 32 e
# 48, guardate ingrandite su fondo chiaro e su fondo scuro. Quello che il browser
# usa davvero resta `/icon.png`, cioè un PNG da 512 che si arrangia a scalare — e
# a 16 pixel la differenza si **vede**: più morbido, i contorni impastati. È il
# prezzo, ed è stato pagato consapevolmente una seconda volta: non vale una
# modifica alla configurazione di un server in produzione. Chi rilegge questa nota
# fra sei mesi non deve rifare l'analisi, deve solo sapere che è stata fatta due
# volte con due disegni diversi e ha dato lo stesso esito.
#
# **Come si correggerebbe**, il giorno che lo si volesse: da Ploi → il sito →
# Manage → Nginx configuration, si **cancella** quel blocco. Senza di lui
# `/favicon.ico` ricade nel `location /` qui sotto e viene proxato come tutto il
# resto. Poi `sudo nginx -t && sudo systemctl reload nginx`.
# ⚠ Non si aggiunge un `location = /favicon.ico` *qui*: sarebbe un secondo match
# esatto sullo stesso percorso nello stesso server block, e nginx rifiuta di
# ripartire. Va sostituito quello di Ploi, non affiancato.

# La rotta dello stream SSE: `GET /api/auctions/<uuid>/stream`.
# Deve stare **prima** di `location /`: le location con regex hanno priorità
# sul prefisso, ma tenerle in ordine di lettura evita discussioni.
location ~ ^/api/auctions/[^/]+/stream$ {
    proxy_pass http://127.0.0.1:3000;

    proxy_http_version 1.1;
    # Vuoto, non "upgrade": SSE è una normale risposta HTTP che non finisce mai.
    proxy_set_header Connection "";

    # Le quattro righe per cui esiste questo blocco.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;

    # Un'asta a 8 dura due ore su una sola connessione. Il default (60s) la
    # chiuderebbe comunque solo in assenza di traffico — e il `: ping` ogni 15
    # secondi la tiene viva — ma qui non serve nessun timeout: chi se ne va
    # chiude la connessione, e l'app lo sente da `request.signal`.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Tutto il resto dell'applicazione.
location / {
    proxy_pass http://127.0.0.1:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # `trustHost: true` in lib/auth.ts si fida di questi header per costruire i
    # redirect del login: se `X-Forwarded-Proto` non arriva, Auth.js rimanda su
    # `http://` e il browser rifiuta il cookie `__Secure-`.

    # L'upload del listone è un POST multipart di un `.xlsx`. Il default di
    # nginx è 1 MB: un file di Fantacalcio.it ci sta dentro, ma un 413 in fase
    # di setup sarebbe dieci minuti persi a capire di chi è la colpa.
    client_max_body_size 10M;
}
